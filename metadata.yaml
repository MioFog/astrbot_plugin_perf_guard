name: astrbot_plugin_perf_guard
display_name: 性能守护
short_desc: 回复慢诊断 + 插件报错/模型失败监测 + 一键体检 + 内存/日志/重启自动化（自身开销极低）
desc: AstrBot 性能守护：诊断回复慢的原因（事件循环卡顿定位到具体插件、消息响应耗时统计），监测"不回话"类故障（别的插件报错点名、模型调用失败率、插件加载失败、磁盘余量、数据库体积），并提供一键体检与内存释放、日志清理、内存超阈值/定时重启。自身常驻开销约 0.004% 单核，只在 AstrBot 自己的日志范围内清理、只注册一个 LLM 工具，尽量避免与其它插件冲突
version: "1.4.0"
author: Alistair_MioFog
astrbot_version: ">=4.4.0,<5"
